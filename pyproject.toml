
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taeda"
version = "0.1.1"
description = "A torch utils library"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "torch",
    "nvidia-ml-py"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
